<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VYANA VISION — Official Website</title>

  <meta
    name="description"
    content="Official website of VYANA VISION. Music, Emotion, Vision."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: #020207;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      background-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.16),
          rgba(0, 0, 0, 0.02) 62%,
          rgba(0, 0, 0, 0.78)
        ),
        url("vyana-vision-background.png.png");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 22px 5%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.72),
        transparent
      );
    }

    .brand {
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px rgba(185, 72, 255, 0.85),
        0 0 20px rgba(47, 118, 255, 0.55);
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .navigation a {
      color: rgba(255, 255, 255, 0.88);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      transition: 0.25s;
    }

    .navigation a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #a73cff;
    }

    .content {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 105px;

  width: 100%;
  padding: 0 20px;

  display: flex;
  justify-content: center;
  align-items: center;
}

      padding: 30px 20px 35px;
    }

    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;

      padding: 16px;
      border-radius: 26px;

      background: rgba(3, 3, 12, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.17);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 0 30px rgba(125, 35, 255, 0.26),
        0 0 45px rgba(0, 95, 255, 0.15);
    }

    .social-button {
      min-width: 130px;
      padding: 13px 20px;

      border: 1px solid rgba(199, 128, 255, 0.62);
      border-radius: 30px;

      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.8px;

      background: linear-gradient(
        135deg,
        rgba(133, 34, 255, 0.27),
        rgba(0, 99, 255, 0.18)
      );

      box-shadow:
        inset 0 0 14px rgba(255, 255, 255, 0.06),
        0 0 13px rgba(139, 43, 255, 0.3);

      transition:
        transform 0.25s,
        background 0.25s,
        box-shadow 0.25s;
    }

    .social-button:hover {
      transform: translateY(-3px);

      background: linear-gradient(
        135deg,
        rgba(181, 62, 255, 0.55),
        rgba(0, 124, 255, 0.46)
      );

      box-shadow:
        0 0 18px rgba(182, 56, 255, 0.72),
        0 0 28px rgba(0, 111, 255, 0.45);
    }

    footer {
      width: 100%;
      padding: 18px 5% 24px;

      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);

      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.92),
        rgba(0, 0, 0, 0.35),
        transparent
      );
    }

    .legal-links {
      margin-bottom: 9px;
    }

    .legal-links a {
      margin: 0 8px;
      color: rgba(255, 255, 255, 0.76);
      text-decoration: none;
    }

    .legal-links a:hover {
      color: #ffffff;
    }

    @media (max-width: 768px) {
      .hero {
        min-height: 100svh;
        background-position: center center;
      }

      .topbar {
        justify-content: center;
        padding: 18px 16px;
      }

      .navigation {
        display: none;
      }

      .content {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 125px;

  width: 100%;
  padding: 0 14px;

  display: flex;
  justify-content: center;
}
  

      .social-button {
        flex: 1 1 42%;
        min-width: 125px;
        padding: 12px 14px;
      }
    }

    @media (max-width: 430px) {
      .hero {
        background-size: auto 100%;
        background-position: center top;
      }

      .brand {
        font-size: 15px;
        letter-spacing: 2px;
      }

      .content {
        padding-bottom: 24px;
        .content {
  bottom: 135px;
  padding: 0 12px;
}
      }

      .social-buttons {
        background: rgba(2, 2, 10, 0.58);
      }

      .social-button {
        font-size: 13px;
      }

      footer {
        padding-left: 10px;
        padding-right: 10px;
      }

      .legal-links a {
        margin: 0 5px;
      }
      /* FINAL RESPONSIVE FIX */

@media (max-width: 768px) {

  }

  }

  .social-button {

  }

  footer {

  .legal-links {

@media (max-width: 390px) {

  .brand {

  }

  }

  .social-buttons {
    gap: 9px;
    padding: 11px;
  }

  .social-button {
    padding: 12px 4px;
    font-size: 13px;
  }

  .legal-links {
    gap: 9px;
  }

  .legal-links a {

  }

  footer {

  }
}
    }
